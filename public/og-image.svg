<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a09"/>
      <stop offset="100%" style="stop-color:#1c1917"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="blob1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="blob2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="80"/>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#292524" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Decorative glows -->
  <ellipse cx="100" cy="80" rx="350" ry="280" fill="url(#blob1)" filter="url(#blur1)"/>
  <ellipse cx="1100" cy="550" rx="300" ry="250" fill="url(#blob2)" filter="url(#blur1)"/>

  <!-- Logo badge -->
  <rect x="80" y="80" width="80" height="80" rx="16" fill="url(#accent-gradient)"/>
  <text x="120" y="138" font-family="Satoshi, system-ui, sans-serif" font-size="40" font-weight="900" fill="#0c0a09" text-anchor="middle">AG</text>

  <!-- Main content -->
  <text x="80" y="260" font-family="Satoshi, system-ui, sans-serif" font-size="72" font-weight="700" fill="#fafaf9">Adam Grady</text>

  <text x="80" y="340" font-family="Satoshi, system-ui, sans-serif" font-size="40" font-weight="600" fill="#f59e0b">Senior Software Engineer</text>

  <text x="80" y="420" font-family="Geist, system-ui, sans-serif" font-size="26" fill="#a8a29e">Full-stack web development with React, TypeScript,</text>
  <text x="80" y="460" font-family="Geist, system-ui, sans-serif" font-size="26" fill="#a8a29e">and modern web technologies.</text>

  <!-- Tech stack pills -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="90" height="36" rx="18" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="24" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="500" fill="#fbbf24" text-anchor="middle">React</text>

    <rect x="100" y="0" width="120" height="36" rx="18" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="160" y="24" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="500" fill="#fbbf24" text-anchor="middle">TypeScript</text>

    <rect x="230" y="0" width="70" height="36" rx="18" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="265" y="24" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="500" fill="#fbbf24" text-anchor="middle">Vite</text>

    <rect x="310" y="0" width="90" height="36" rx="18" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="355" y="24" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="500" fill="#fbbf24" text-anchor="middle">.NET</text>
  </g>

  <!-- Website URL -->
  <text x="1120" y="580" font-family="Geist Mono, ui-monospace, monospace" font-size="20" font-weight="500" fill="#78716c" text-anchor="end">adamgrady.dev</text>
</svg>
